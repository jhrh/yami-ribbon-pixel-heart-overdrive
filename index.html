<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Yami Ribbon: Pixel Heart Overdrive</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090713;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh}#gamebox{width:min(100vw,160vh);aspect-ratio:16/9;position:relative;background:#130d29;box-shadow:0 0 40px #ff38b855}canvas{width:100%;height:100%;image-rendering:pixelated;display:block}#screen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#090713d9;padding:20px}h1{font-size:clamp(28px,6vw,64px);color:#ff62ce;text-shadow:4px 4px #63134e;margin:0}h2{color:#8be8ff;letter-spacing:.2em;font-size:clamp(12px,2vw,20px)}p{line-height:1.6;font-size:clamp(11px,1.5vw,16px)}button{background:#d82a9e;border:3px solid white;color:white;font-weight:900;padding:12px 20px;font-size:16px;touch-action:none}#hud{position:absolute;top:3%;left:3%;right:3%;display:none;justify-content:space-between;font-weight:900;text-shadow:2px 2px #000;pointer-events:none}#controls{position:absolute;bottom:3%;left:3%;right:3%;display:none;justify-content:space-between;pointer-events:none}.group{display:flex;gap:8px;pointer-events:auto}.pad{width:clamp(42px,8vw,65px);height:clamp(42px,8vw,65px);border:2px solid #fff;background:#33204dcc;color:white;border-radius:10px;font-size:20px;padding:0}@media(pointer:coarse){#controls{display:flex}}
</style></head><body><main id="gamebox"><canvas id="c" width="480" height="270"></canvas>
<div id="hud"><span id="hero">REI-METAL</span><span>STAGE 01 · NEON DISTRICT</span><span id="score">SCORE 000000</span></div>
<div id="screen"><div><h1>YAMI RIBBON</h1><h2>PIXEL HEART OVERDRIVE</h2><p>INSERT COIN　SYSTEM BOOT<br>ワン！ツー！スリー！ READY PLAYER?<br><br>Avanza por el Distrito Neón, derrota enemigos y vence a SYSTEM ERROR.<br>PC: A/D o ←/→ mover · ESPACIO saltar · Z atacar · 1/2/3 cambiar integrante</p><button id="start">PRESS START</button></div></div>
<div id="controls"><div class="group"><button class="pad" data-k="left">◀</button><button class="pad" data-k="right">▶</button><button class="pad" data-k="jump">▲</button></div><div class="group"><button class="pad" data-k="attack">✦</button><button class="pad" data-k="switch">↻</button></div></div></main>
<script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),screen=document.querySelector('#screen'),hud=document.querySelector('#hud'),hero=document.querySelector('#hero'),scoreNode=document.querySelector('#score');const W=480,H=270,F=226;
const girls=[{n:'REI-METAL',color:'#ed36b8',dark:'#74145f',hair:'#241020',glow:'#ff75dc',speed:2.8},{n:'HANA-METAL',color:'#ed334c',dark:'#771c2b',hair:'#281018',glow:'#ff6370',speed:2.1},{n:'MIKA-METAL',color:'#238fe7',dark:'#123e86',hair:'#101a39',glow:'#69caff',speed:2.3}];
let p,active,score,camera,enemies,shots,boss,keys={},mode='title',tick=0;
function reset(){p={x:55,y:F-39,vy:0,hp:100,face:1,ground:true,cool:0,inv:0};active=0;score=0;camera=0;shots=[];boss=null;enemies=Array.from({length:12},(_,i)=>({x:250+i*125,y:F-26,hp:2,k:i%3,alive:true}));}
function box(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function label(t,x,y,size=8,col='#fff'){g.fillStyle=col;g.font='bold '+size+'px monospace';g.fillText(t,x,y)}
function background(){let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#100d2b');grad.addColorStop(1,'#35133e');g.fillStyle=grad;g.fillRect(0,0,W,H);for(let i=0;i<40;i++){let sx=(i*71-camera*.12)%W;if(sx<0)sx+=W;box(sx,(i*37)%130,2,2,i%2?'#8d72bd':'#ff83d5')}for(let i=0;i<13;i++){let bx=i*48-camera*.28%48,bh=45+i*29%65;box(bx,170-bh,34,bh,'#171936');for(let yy=180-bh;yy<165;yy+=12)for(let xx=bx+7;xx<bx+30;xx+=10)box(xx,yy,3,4,'#e83caa')}box(355,35,56,19,'#5c1c68');label('YAMI',365,48,9,'#ff72d2');box(0,F,W,H-F,'#171326');box(0,F,W,3,'#ff4bc8');for(let i=0;i<25;i++){let xx=(i*29-camera)%W;if(xx<0)xx+=W;box(xx,F+15,14,2,'#472454')}}
function girl(x,y,id,face=1,attack=0){let a=girls[id];g.save();if(face<0){g.translate(x+24,0);g.scale(-1,1);x=0}box(x+2,y+2,7,15,a.hair);box(x+17,y+2,7,15,a.hair);box(x+4,y,18,13,a.hair);box(x+5,y+4,16,8,'#f0c7d9');box(x+5,y+3,16,3,a.hair);box(x+8,y+7,2,2,'#24122a');box(x+16,y+7,2,2,'#24122a');box(x+5,y+13,16,13,a.color);box(x+7,y+16,12,2,a.dark);box(x+10,y+14,2,8,'#f4d4d7');box(x+6,y+25,15,3,'#171020');box(x+5,y+28,7,5,'#171020');box(x+14,y+28,7,5,'#171020');box(x+3,y+32,9,3,a.color);box(x+14,y+32,9,3,a.color);box(x+2,y+37,9,3,a.dark);box(x+13,y+37,10,3,a.dark);box(x+3,y+1,4,3,a.glow);box(x+19,y+1,4,3,a.glow);if(attack){box(x+22,y+17,12,3,a.glow);box(x+30,y+14,4,9,'#fff')}g.restore()}
function enemy(e){let col=['#9c39c9','#25b8c8','#d94167'][e.k],x=e.x-camera;box(x,e.y,19,23,'#1a1027');box(x+3,e.y-4,13,8,col);box(x+5,e.y+5,3,3,'white');box(x+12,e.y+5,3,3,'white');box(x+1,e.y+23,5,3,'#ff4bc8');box(x+14,e.y+23,5,3,'#ff4bc8')}
function draw(){background();if(mode==='title'){girl(178,174,0);girl(229,174,1);girl(280,174,2);return}enemies.forEach(e=>{if(e.alive&&e.x-camera>-30&&e.x-camera<510)enemy(e)});if(boss){let x=boss.x-camera;box(x,150,42,65,'#25102f');box(x+5,143,32,12,'#ff3c9e');box(x+9,165,6,6,'white');box(x+27,165,6,6,'white');label('SYSTEM ERROR',x-9,136,7,'#ff8bd8');box(300,20,150,5,'#40152f');box(300,20,150*boss.hp/30,5,'#ff416f')}if(p.inv%6<3)girl(p.x-camera,p.y,active,p.face,p.cool>4);shots.forEach(s=>box(s.x-camera,s.y,8,3,s.color));label('HP '+Math.max(0,Math.ceil(p.hp)),8,15,9,'#ff9cda');label('AREA 01',8,251,7,'#b69ad9')}
function end(title,sub){mode='end';screen.style.display='grid';screen.innerHTML='<div><h1>'+title+'</h1><h2>'+sub+'</h2><p>PRESS START TO PLAY AGAIN</p><button id="again">CONTINUE ▶</button></div>';document.querySelector('#again').onclick=start}
function update(){tick++;if(mode!=='play')return;let a=girls[active];p.vx=0;if(keys.left){p.vx=-a.speed;p.face=-1}if(keys.right){p.vx=a.speed;p.face=1}p.x=Math.max(0,Math.min(1500,p.x+p.vx));if(keys.jump&&p.ground){p.vy=-6.2;p.ground=false}p.vy+=.28;p.y+=p.vy;if(p.y>=F-39){p.y=F-39;p.vy=0;p.ground=true}if(p.cool>0)p.cool--;if(p.inv>0)p.inv--;if(keys.attack&&p.cool===0){p.cool=12;shots.push({x:p.x+(p.face>0?23:-8),y:p.y+18,v:p.face*5,color:a.glow,life:28,damage:active===1?2:1})}if(keys.switch){active=(active+1)%3;keys.switch=false}shots.forEach(s=>{s.x+=s.v;s.life--;enemies.forEach(e=>{if(e.alive&&Math.abs(s.x-e.x)<18&&Math.abs(s.y-e.y)<28){e.hp-=s.damage;s.life=0;if(e.hp<=0){e.alive=false;score+=100}}});if(boss&&Math.abs(s.x-boss.x)<38&&s.life>0){boss.hp--;s.life=0;score+=25}});shots=shots.filter(s=>s.life>0);enemies.forEach(e=>{if(e.alive&&Math.abs(e.x-p.x)<22&&Math.abs(e.y-p.y)<34&&p.inv===0){p.hp-=.35;p.inv=8}});if(p.x>1300&&!boss)boss={x:1390,hp:30};if(boss&&Math.abs(boss.x-p.x)<42&&p.inv===0){p.hp-=.5;p.inv=8}camera=Math.max(0,Math.min(1050,p.x-170));if(boss&&boss.hp<=0)end('SYSTEM DEFEATED','YAMI RIBBON SAVED THE NEON WORLD!');if(p.hp<=0)end('GAME OVER','CONTINUE?');hero.textContent=a.n;scoreNode.textContent='SCORE '+String(score).padStart(6,'0')}
function start(){reset();mode='play';screen.style.display='none';hud.style.display='flex'}
document.querySelector('#start').onclick=start;
function key(e,on){let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','z','j','a','d','1','2','3'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=on;if(k==='arrowright'||k==='d')keys.right=on;if(k==='arrowup'||k===' ')keys.jump=on;if(k==='z'||k==='j')keys.attack=on;if(on&&['1','2','3'].includes(k))active=+k-1;if(on&&k==='x')keys.switch=true}
addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;let on=e=>{e.preventDefault();if(k==='switch')keys.switch=true;else keys[k]=true},off=e=>{e.preventDefault();if(k!=='switch')keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
function loop(){update();draw();requestAnimationFrame(loop)}reset();loop();
})();
</script></body></html>
